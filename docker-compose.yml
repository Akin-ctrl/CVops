
services:

 # -------------------------------------------------------
 # PRODUCER (CAMER STREAM INGESTOR)
 # -------------------------------------------------------
  kafka-producer: 
    build: 
      context: ./kafka-producers 
      dockerfile: Dockerfile.producer
    container_name: kafka_producer
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # KAFKA_BROKER: ${KAFKA_BROKER} 
      KAFKA_BROKER: localhost:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC_1}
      URL: ${URL}
    restart: unless-stopped


  # -------------------------------------------------------
  # CORE INFRASTRUCTURE
  # -------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes: 
      - zookeeper_data:/data
      - zookeeper_log:/datalog

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_TOPIC_NAME: ${KAFKA_TOPIC}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes: 
      - kafka_data:/var/lib/kafka/data  
  
  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: cv_kafdrop
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    ports:
      - "19000:9000"
    restart: unless-stopped
  


  # -------------------------------------------------------
  # PREPROCESSOR
  # -------------------------------------------------------
  kafka-preprocessor:
    build: 
      context: ./kafka-consumer 
      dockerfile: Dockerfile.consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_INPUT_TOPIC: ${KAFKA_TOPIC_1}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_TOPIC_2}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_1}
    restart: unless-stopped


 # -------------------------------------------------------
 # VIEWERS
 # -------------------------------------------------------
  kafka-viewer: 
    build: 
      context: ./view-process
      dockerfile: Dockerfile.viewer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_2}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_2}
    ports:
      - "5000:5000" 
    restart: unless-stopped

  detector-viewer: 
    build: 
      context: ./view-detection
      dockerfile: Dockerfile.viewer-d
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_4}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_4}
    ports:
      - "7000:7000" 
    restart: unless-stopped

 # -------------------------------------------------------
 # MODEL INFERENCE
 # -------------------------------------------------------
  yolo-inference:
    build: 
      context: ./model
      dockerfile: Dockerfile.model
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_INPUT_TOPIC: ${KAFKA_TOPIC_2}
      KAFKA_VISUAL_TOPIC: ${KAFKA_TOPIC_4}
      KAFKA_DATA_TOPIC: ${KAFKA_TOPIC_3}
      MODEL_WEIGHTS_PATH: ${MODEL_WEIGHTS_PATH}
      DEVICE: "cpu" # Set to "0" if you have Nvidia Docker setup
    restart: unless-stopped


  
