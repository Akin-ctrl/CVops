
services:

 # -------------------------------------------------------
 # PRODUCER (CAMER STREAM INGESTOR)
 # -------------------------------------------------------
  kafka-producer: 
    build: 
      context: ./kafka-producers 
      dockerfile: Dockerfile.producer
    container_name: kafka_producer
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # KAFKA_BROKER: ${KAFKA_BROKER} 
      KAFKA_BROKER: localhost:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC_1}
      URL: ${URL}
      METRICS_PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped


  # -------------------------------------------------------
  # CORE INFRASTRUCTURE
  # -------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kafka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes: 
      - zookeeper_data:/data
      - zookeeper_log:/datalog

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KAFKA_TOPIC_NAME: ${KAFKA_TOPIC}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes: 
      - kafka_data:/var/lib/kafka/data  
  
  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: cv_kafdrop
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    ports:
      - "19000:9000"
    restart: unless-stopped
  


  kafka-preprocessor:
    container_name: cv_kafka_preprocessor
    build: 
      context: ./kafka-consumer 
      dockerfile: Dockerfile.consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_INPUT_TOPIC: ${KAFKA_TOPIC_1}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_TOPIC_2}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_1}
      METRICS_PORT: 8001
    ports:
      - "8001:8001"
    restart: unless-stoppedKAFKA_TOPIC_1}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_TOPIC_2}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_1}
    restart: unless-stopped


 # -------------------------------------------------------
 # VIEWERS
 # -------------------------------------------------------
  kafka-viewer: 
    container_name: kafka_viewer
    build: 
      context: ./view-process
      dockerfile: Dockerfile.viewer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_2}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_2}
      METRICS_PORT: 8004
    ports:
      - "5000:5000"
      - "8004:8004"
  detector-viewer: 
    container_name: detector_viewer
    build: 
      context: ./view-detection
      dockerfile: Dockerfile.viewer-d
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_4}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_4}
      METRICS_PORT: 8005
    ports:
      - "7000:7000"
      - "8005:8005"
    restart: unless-stopped
      - "7000:7000" 
    restart: unless-stopped

  yolo-inference:
    container_name: yolo_inference
    build: 
      context: ./model
      dockerfile: Dockerfile.model
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_INPUT_TOPIC: ${KAFKA_TOPIC_2}
      KAFKA_VISUAL_TOPIC: ${KAFKA_TOPIC_4}
      KAFKA_DATA_TOPIC: ${KAFKA_TOPIC_3}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_3}
      MODEL_WEIGHTS_PATH: ${MODEL_WEIGHTS_PATH}
      DEVICE: "cpu"
      USE_TRACKING: "false"  # Detection only - much faster
      INPUT_SIZE: "320"      # Smaller = faster (320 is ~2x faster than 416)
      METRICS_PORT: 8002
    ports:
      - "8002:8002"
    restart: unless-stopped
      USE_TRACKING: "false"  # Detection only - much faster
      INPUT_SIZE: "320"      # Smaller = faster (320 is ~2x faster than 416)
    restart: unless-stopped


  
  # -------------------------------------------------------
  # DATA STORAGE AND MANAGEMENT 
  minio-writer:
    container_name: minio_writer
    build:
      context: ./minio
      dockerfile: Dockerfile.minio-writer
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC_3}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID_5}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      BUCKET_NAME: detections-data
      BATCH_SIZE: 50 # Write a file after 50 detections...
      BATCH_TIMEOUT_SEC: 30 # ...or every 30 seconds
      METRICS_PORT: 8003
    ports:
      - "8003:8003"
    restart: unless-stoppedns-data
      BATCH_SIZE: 50 # Write a file after 50 detections...
      BATCH_TIMEOUT_SEC: 30 # ...or every 30 seconds
    restart: unless-stopped


  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
   


  # -------------------------------------------------------
  # OBSERVABILITY AND MONITORING
  # -------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cv_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: cv_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped


  # -------------------------------------------------------
